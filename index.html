<!DOCTYPE html>
<html>
<head>
    <title>Мой сайт на GitHub Pages</title>
</head>
<body>
    <h1>Привет, мир!</h1>
    <p>Этот сайт работает на GitHub Pages с автотестами!</p>
    <p>Текущая дата и время: <span id="datetime"></span></p>

    <script>
        function updateDateTime() {
            const now = new Date();
            const datetimeElement = document.getElementById('datetime');
            if (datetimeElement) {
                datetimeElement.textContent = now.toLocaleString();
            }
        }
        updateDateTime();
        setInterval(updateDateTime, 1000);
    </script>
</body>
</html>
