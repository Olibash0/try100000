name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tests
        run: bash test.sh

      - name: Deploy to GitHub Pages
        if: success()
        uses: actions/deploy-pages@v4